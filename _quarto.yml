project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!materials/workshop/"

lang: ko-KR
date-format: "YYYY년 MM월 DD일"


website:
  title: "한국 R 사용자회"
  site-url: https://r2bit.com
  image: "fig/koRea_logo.png"
  google-analytics: "UA-229551680-1"
  page-footer:
    center: "사업자 등록번호: 735-82-003300 | 대표: 형환희 | 전자우편: <a href='mailto:admin@r2bit.com'>admin@r2bit.com</a> | 주소: 서울특별시 서초구 법원로3길 15, 4층<br>&copy; 2026 BitStat. All rights reserved. | 본 웹사이트는 <a href='https://quarto.org/'>쿼토(Quarto)</a>로 제작되었습니다."
    
  navbar:
    background: "#2c4f70"
    # 좌상단 로고 (투명 여백을 잘라낸 navbar 전용 버전, 흰색 라운드 칩 스타일은 css/quarto.scss)
    logo: fig/koRea_logo_navbar.png
    logo-alt: "한국 R 사용자회 로고"
    left:
      - href: index.qmd
        text: "홈"
      - href: about.qmd
        text: "소개"
      - href: activities.qmd
        text: "활동·교육"
      - text: "공개 패키지"
        href: packages.qmd
      - text: "발행 도서"
        href: book.qmd
      - text: "공개 데이터"
        href: data.qmd
      - href: blog.qmd
        text: "블로그"
      - text: "관련 링크"
        menu:
          - text: "한국 R 컨퍼런스"
            href: https://use-r.kr/
          - text: "서울 R Meetup"
            href: https://www.meetup.com/seoul-r-meetup
          - text: "서울 R Meetup Archive"
            href: https://tidyverse-korea.github.io/seoul-R/
          - text: "----------------"
          - text: "글로벌 R Meetup"
            href: https://r2bit.com/seoul-r/
          - text: "쿼토(Quarto)"
            href: https://quarto.org/

    right:
      - icon: discord
        href: https://discord.gg/j2XTYQwyr8
      - icon: github
        href: https://github.com/bit2r
      - icon: facebook
        href: https://www.facebook.com/groups/tidyverse
      - icon: youtube
        href: https://www.youtube.com/channel/UCW-epmIvjBEhhVXw_F0Nqbw
        
  sidebar:
    style: docked
    title: "공익법인 한국 R 사용자회"
    contents:
      - text: "소개"
        href: about.qmd
      - text: "행동강령(CoC)"
        href: coc.qmd
      - text: "후원 참여 및 기부 안내"
        href: donation.qmd
      - text: "기부금 모금/활용실적"
        href: records.qmd
      - text: "과학기술정보통신부"
        href: https://www.msit.go.kr/
      - text: "Privacy Policy"
        href: privacy_policy.qmd
      - text: "Terms of Service"
        href: terms_of_service.qmd

format:
  html:
    theme:
      - litera
      - css/quarto.scss
    toc: true
    # navbar 타이틀의 "R" 만 로고 색(파랑)으로 강조 (부분 색상은 마크업이 필요해 스크립트로 처리)
    include-after-body:
      text: |
        <script>
        (function () {
          var t = document.querySelector('.navbar-title');
          if (t) t.innerHTML = '한국<span class="brand-r">R</span>사용자회';
        })();
        </script>

filters:
  - parse-latex

    
execute:
  freeze: false
